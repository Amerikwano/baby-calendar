name: 혜택 자료 매일 갱신
on:
  schedule:
    - cron: '17 19 * * *' # 한국 시간 새벽 4시 17분
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: update-benefits
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-benefits.js
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 바뀐 내용 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain regions)" ]; then echo "바뀐 내용 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions
          git commit -m "혜택 자료 갱신"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
