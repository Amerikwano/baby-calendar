<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>우리 아기 수첩</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="아기 수첩">
<meta name="theme-color" content="#faf5ee">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/npm/@kfonts/nanum-square-round@0.2.0/NanumSquareRoundR.woff2">
<style>
/* 첫 화면은 다른 파일을 기다리지 않고 바로 보인다 */
html,body{background:#faf5ee}
#splash{position:fixed;inset:0;z-index:50;background:#faf5ee;display:grid;place-content:center;justify-items:center;gap:10px;color:#4f3f3a;font-family:NanumSquareRound,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;transition:opacity .35s}
#splash.off{opacity:0;pointer-events:none}
#splash .ring{width:148px;height:148px;border-radius:50%;background:#fff;border:7px solid #ffd976;display:grid;place-items:center;overflow:hidden;animation:bob 1.6s ease-in-out infinite}
#splash .ring svg{width:112px}#splash .ring img{width:100%;height:100%;object-fit:cover}
#splash b{font-size:27px;font-weight:700;margin-top:12px}#splash span{font-size:15px;color:#7a685d}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){#splash .ring{animation:none}#splash{transition:none}}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" role="status"><div class="ring" id="splashFace"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12c-3-7 5-10 8-5" fill="none" stroke="#8a6a4f" stroke-width="3.5" stroke-linecap="round"/><circle cx="14" cy="54" r="8" fill="#ffd9c2"/><circle cx="86" cy="54" r="8" fill="#ffd9c2"/><circle cx="50" cy="52" r="37" fill="#ffe6d3"/><circle cx="37" cy="50" r="3.6" fill="#4f3f3a"/><circle cx="63" cy="50" r="3.6" fill="#4f3f3a"/><ellipse cx="28" cy="61" rx="6.5" ry="4.5" fill="#ffb9a3"/><ellipse cx="72" cy="61" rx="6.5" ry="4.5" fill="#ffb9a3"/><path d="M42 62q8 8 16 0" fill="none" stroke="#4f3f3a" stroke-width="3.2" stroke-linecap="round"/></svg></div><b>우리 아기 수첩</b><span id="splashText">오늘도 한 뼘 자랐어요</span></div>
<header id="top" hidden></header>
<div class="wrap"><main id="main" class="stack"></main></div>
<nav aria-label="메뉴" hidden></nav>
<dialog id="dlg"></dialog>
<dialog id="mapdlg"></dialog>
<div id="toast" role="status" hidden></div>
<script src="schedule.js"></script>
<script src="base-benefits.js"></script>
<script src="base-tips.js"></script>
<script src="local.js"></script>
<script src="regions.js"></script>
<script src="family.js"></script>
<script src="hospitals.js"></script>
<script src="drive.js"></script>
<script src="login.js"></script>
<script src="icons.js"></script>
<script src="care.js"></script>
<script src="album.js"></script>
<script src="onboard.js"></script>
<script src="app.js"></script>
</body>
</html>
