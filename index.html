<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>우리 아기 수첩</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="아기 수첩">
<meta name="theme-color" content="#fff8d9">
<style>
/* 배치: 위쪽 디데이와 키재기 자, 아래쪽 다섯 칸 메뉴. 완료는 접종 도장으로 표시한다. */
:root{--bg:#fff8d9;--card:#fffefa;--ink:#33291a;--sub:#6f6147;--line:#ecdfae;--soft:#fdeeb0;--stamp:#b52d27;--stamp-soft:#ffe3da;
--vaccine:#1c7765;--check:#a45f00;--oral:#7450a8;--screen:#2463b0;--mine:#ad3a72;color-scheme:light;
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box;touch-action:pan-y}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:clip}
html:has(dialog[open]){overflow:hidden}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--screen);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.wrap>*{min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:17px;margin:0;font-weight:700}
h2{font-size:18px;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:14px;margin:0;color:var(--sub);font-weight:600}
p{margin:0}.sub{color:var(--sub);font-size:13.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.stack{display:grid;gap:10px}.stack>*{min-width:0}
.btn{min-height:40px;padding:8px 14px;border-radius:8px;background:var(--soft);font-weight:600}
.btn.main{background:var(--ink);color:var(--bg)}.btn.danger{color:var(--stamp)}.btn:disabled{opacity:.5;cursor:default}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.dday{font-size:clamp(52px,15vw,84px);line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ruler{display:grid;gap:4px}
.ticks{position:relative;height:34px;border-bottom:2px solid var(--ink)}
.ticks i{position:absolute;bottom:0;width:1px;background:var(--sub);height:8px}.ticks i.l{height:16px;width:2px;background:var(--ink)}
.ticks b{position:absolute;bottom:-2px;width:4px;margin-left:-2px;height:34px;background:var(--stamp)}
.rl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.list{display:grid;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 0;border-bottom:1px solid var(--line);min-height:60px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.t-vaccine{--c:var(--vaccine)}.t-check{--c:var(--check)}.t-oral{--c:var(--oral)}.t-screen{--c:var(--screen)}.t-mine{--c:var(--mine)}.t-diary{--c:var(--sub)}
.item b{display:block;font-weight:650}.item .when{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);white-space:nowrap}
.chip.hot{background:var(--stamp-soft);color:var(--stamp)}
.stampmark{width:46px;height:46px;border:2px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;font-size:11.5px;line-height:1.15;font-weight:800;text-align:center;transform:rotate(-10deg)}
.notice{background:var(--soft);border-radius:10px;padding:14px;display:grid;gap:10px}
.notice.hot{background:var(--stamp-soft)}
nav{position:fixed;inset:auto 0 0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{min-height:58px;color:var(--sub);font-weight:600;border-top:3px solid transparent}
nav button[aria-current=page]{color:var(--ink);border-top-color:var(--stamp)}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px}
.seg button{padding:6px 16px;border-radius:7px;min-height:36px;font-weight:600;color:var(--sub)}.seg button[aria-pressed=true]{background:var(--card);color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal span{text-align:center;font-size:12.5px;color:var(--sub);padding:8px 0}
.day{min-height:56px;padding:6px 2px;display:grid;align-content:start;justify-items:center;gap:5px;border-top:1px solid var(--line);min-width:0;font-variant-numeric:tabular-nums}
.day em{font-style:normal;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today em{border:2px solid var(--stamp)}.day.sel{background:var(--soft)}.day.sel em{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--sub)}.legend span{display:flex;gap:6px;align-items:center}
.paper{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.paper p.body{white-space:pre-wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.grid button{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--soft);position:relative}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .x{position:absolute;inset:auto 4px 4px auto;background:var(--card);border-radius:6px;font-size:12px;padding:2px 7px}
a{color:var(--screen)}
details summary{cursor:pointer;font-weight:650;padding:10px 0}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);background:var(--card);color:var(--ink);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgb(10 16 28/.55)}
dialog form{padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}dialog form>*{min-width:0;max-width:100%}
dialog.wide{width:min(900px,calc(100vw - 24px))}dialog.wide img{max-width:100%;max-height:60vh;margin:auto;display:block;border-radius:8px}
label.f{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;font-weight:600;font-size:13.5px}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;min-height:44px;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;text-align:left}input::-webkit-date-and-time-value{text-align:left}
textarea{min-height:150px;resize:vertical;line-height:1.6}
fieldset{border:0;padding:0;margin:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}legend{font-weight:600;font-size:13.5px;padding:0 0 6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}.two>*{min-width:0}
.ck{display:flex;gap:8px;align-items:center;min-height:32px}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;z-index:9;max-width:calc(100vw - 32px);font-weight:600}
.kids{display:flex;gap:8px;flex-wrap:wrap}.kids button{min-height:40px;padding:6px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;max-width:100%}.kids button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kidbox{border:1px solid var(--line);border-radius:12px;padding:14px;gap:14px}
.mission{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center}.mission .face{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--soft);border:2px dashed var(--stamp);display:grid;place-items:center;padding:0}.mission .face.on{border-style:solid}.mission img{width:100%;height:100%;object-fit:cover;display:block}
.grid .d{position:absolute;inset:auto 0 0 0;background:rgb(51 41 26/.72);color:#fffefa;font-size:12px;padding:2px 4px;text-align:center}.grid .miss{border:2px dashed var(--line);background:none;color:var(--sub);font-size:13px}
.crop{position:relative;width:100%;max-width:340px;margin:auto;aspect-ratio:1;border-radius:12px;overflow:hidden}.crop canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.crop i{position:absolute;inset:12% 20%;border:3px solid #fffefa;border-radius:50%;box-shadow:0 0 0 400px rgb(51 41 26/.28);pointer-events:none}
input[type=range]{padding:0!important;border:0!important;accent-color:var(--stamp)}
.hosp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.hosp b{display:block}.pin{width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center}.pin svg{width:24px;height:24px}
#map{height:min(54dvh,440px);border-radius:10px;background:var(--soft);z-index:0}#map,#map *{touch-action:none}
.mk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--vaccine);border:3px solid #fffefa;box-shadow:0 1px 4px rgb(0 0 0/.45)}.mk.on{background:var(--stamp)}.mk.me{border-radius:50%;width:18px;height:18px;background:var(--screen)}
.gbtn{display:inline-flex;gap:10px;align-items:center;justify-content:center;min-height:46px;padding:8px 18px;border-radius:8px;background:#fff;border:1px solid #747775;font-weight:600}.gbtn svg{width:18px;height:18px}
progress{width:100%;height:10px;accent-color:var(--stamp)}video{width:100%;max-height:56dvh;border-radius:10px;background:#000;display:block}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.empty{padding:26px 0;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="brand">우리 아기 수첩</h1><button class="btn" data-act="settings">설정</button></header>
  <main id="main" class="stack" style="gap:22px"><p class="empty">불러오는 중</p></main>
</div>
<nav aria-label="메뉴"><div>
  <button data-tab="home">오늘</button><button data-tab="cal">달력</button><button data-tab="diary">기록</button><button data-tab="tips">육아</button><button data-tab="money">혜택</button>
</div></nav>
<dialog id="dlg"></dialog>
<dialog id="mapdlg"></dialog>
<div id="toast" role="status" hidden></div>
<script src="schedule.js"></script>
<script src="base-benefits.js"></script>
<script src="base-tips.js"></script>
<script src="local.js"></script>
<script src="regions.js"></script>
<script src="family.js"></script>
<script src="hospitals.js"></script>
<script src="drive.js"></script>
<script>
'use strict';
const APP_VERSION = '0.5.1';
const S = Schedule, $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('sv-SE');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const WD = '일월화수목금토';
const dow = d => new Date(d + 'T00:00:00Z').getUTCDay();
const kd = (d, y) => { const [a, b, c] = d.split('-').map(Number); return (y || d.slice(0, 4) !== today().slice(0, 4) ? a + '년 ' : '') + `${b}월 ${c}일 (${WD[dow(d)]})`; };
const isDate = d => /^\d{4}-\d\d-\d\d$/.test(d || '');
const TYPE = { vaccine: '예방접종', check: '건강검진', oral: '구강검진', screen: '신생아 검사', mine: '내 일정', diary: '일기' };
const SIDO = Regions.SIDO.map(s => s.name);

const fresh = () => ({ v: 1, kids: [Family.newKid('k1', { birth: today(), options: Object.assign({}, S.DEFAULT_OPTIONS) })], cur: 'k1', sido: '', sigungu: '', leads: [7, 1], hour: 9, events: [], diary: [], photos: [], faces: [], exports: 0 });
const K = () => db.kids.find(k => k.id === db.cur) || db.kids[0];
const kidOf = id => db.kids.find(k => k.id === id) || K();
const many = () => db.kids.length > 1;
const josa = n => { const c = n.charCodeAt(n.length - 1); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? '이' : '가'; };
let db = fresh(), rev = 0, ready = false, started = false, ai = false, tab = 'home', rec = 'diary', month = today().slice(0, 7), sel = today();
const aiData = { tips: null, benefits: null, busy: {}, err: {} };

// 두 손가락·두 번 눌러 확대 막기(아이폰은 viewport 설정만으로는 막히지 않는다)
['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

/* ── 저장 ── */
const GOOGLE_ID = '61502815483-ocflesj39gb56pif53m7qae951jkil49.apps.googleusercontent.com'; // 구글 로그인용 클라이언트 ID(공개해도 되는 값). 비어 있으면 로그인 화면이 나오지 않는다.
const G_LOGO = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
const gBtn = `<button type="button" class="gbtn" data-act="login">${G_LOGO}Google 계정으로 로그인</button>`;
const AI_URL = ''; // 비워 두면 웹에서는 AI를 쓰지 않는다(무료). 주소를 넣으면 설정에 접근 코드 칸이 나온다. // 배포한 AI 서버 주소
let conf = { url: '', code: '' };
try { conf = Object.assign(conf, JSON.parse(localStorage.getItem('baby-ai') || '{}')); } catch { }
const aiBase = () => AI_URL && (conf.url || AI_URL);
function saveAI(code) {
  const changed = code !== conf.code;
  conf = Object.assign({}, conf, { code }); ai = Boolean(aiBase() && conf.code); aiData.err = {};
  try { localStorage.setItem('baby-ai', JSON.stringify(conf)); } catch { }
  // 코드가 맞는지 바로 확인한다. AI를 실행하지 않아 요금은 들지 않는다.
  if (changed && ai) remoteAI('/api/status').then(() => toast('AI가 연결됐어요')).catch(e => toast(e.message));
}
// 웹 서버는 기다리는 동안 빈 줄을 보내고 마지막 줄에 결과를 준다.
async function remoteAI(url, opt) {
  let r, text;
  try { r = await fetch(aiBase() + url, Object.assign({}, opt, { headers: { authorization: 'Bearer ' + encodeURIComponent(conf.code) } })); text = await r.text(); }
  catch { throw new Error('AI 서버에 연결하지 못했어요. 잠시 뒤 다시 누르면 찾던 결과를 이어서 받아요.'); }
  let j; try { j = JSON.parse(text.trim().split('\n').pop()); } catch { throw new Error('AI 서버 응답이 끊겼어요. 잠시 뒤 다시 눌러 주세요.'); }
  const status = r.ok && j.status ? j.status : r.status, body = r.ok && j.status ? j.body : j;
  if (status !== 200) throw Object.assign(new Error(body.error || 'AI 서버에서 오류가 났어요.'), { status });
  return body;
}
let local = false; // 서버 없이 열었으면 이 기기에 저장
async function api(url, opt) {
  if (local && (url === '/api/tips' || url === '/api/benefits')) return remoteAI(url, opt);
  if (local) return Local.api(url, opt);
  let r; try { r = await fetch(url, opt); } catch { throw Object.assign(new Error('서버에 연결하지 못했어요. 터미널에서 앱이 켜져 있는지 확인하세요.'), {}); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || '오류가 났어요.'), { status: r.status, needKey: j.needKey });
  return j;
}
let chain = Promise.resolve(true);
// 저장은 순서대로 한 번씩. 실패하면 화면에 알리고 false를 준다.
function save(change) {
  return chain = chain.then(async () => {
    const before = JSON.stringify(db);
    change(db);
    try { rev = (await api('/api/state', { method: 'PUT', body: JSON.stringify({ rev, data: db }) })).rev; render(); return true; }
    catch (e) {
      db = JSON.parse(before);
      if (e.status === 409) { const s = await api('/api/state').catch(() => null); if (s) { rev = s.rev; db = Object.assign(fresh(), Family.migrate(s.data)); } toast('다른 창에서 바뀐 내용을 불러왔어요. 다시 저장해 주세요.'); }
      else toast('저장하지 못했어요. ' + e.message);
      render(); return false;
    }
  });
}
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3500); }
const items = (k = K()) => S.build(k.birth, k.options, k.records).map(i => Object.assign(i, { kid: k.id }));
const famItems = () => db.kids.flatMap(k => items(k)).sort((a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0);
const tag = id => many() ? `<span class="chip">${id ? esc(kidOf(id).name) : '모두'}</span>` : '';

/* ── 날짜 표현 ── */
function stageOf(d, k = K()) {
  const n = S.diffDays(k.birth, d);
  if (!k.born) return n < 0 ? `예정일 D-${-n}` : n === 0 ? '예정일' : `예정일 +${n}일`;
  return n < 0 ? `태어나기 ${-n}일 전` : `태어난 지 ${n + 1}일째`;
}
function ageText(t) {
  const m = S.ageMonths(K().birth, t);
  if (m < 0) return '';
  return m < 1 ? '신생아' : m < 24 ? `만 ${m}개월` : `만 ${Math.floor(m / 12)}세${m % 12 ? ' ' + m % 12 + '개월' : ''}`;
}
const chipOf = it => {
  const s = S.status(it, today());
  if (s === 'done') return `<span class="stampmark">${it.type === 'vaccine' ? '접종' : '검사'}<br>완료</span>`;
  if (it.appt) return `<span class="chip">예약 ${esc(it.appt.slice(5).replace('-', '/'))}</span>`;
  if (!kidOf(it.kid).born) return '<span class="chip">예정</span>';
  if (s === 'late') return '<span class="chip hot">시기 지남</span>';
  if (s === 'open') { const l = it.hard ? S.diffDays(today(), it.hard) : null; return l !== null && l <= 14 ? `<span class="chip hot">마감 ${l === 0 ? '오늘' : l + '일 전'}</span>` : '<span class="chip">받을 시기</span>'; }
  return `<span class="chip">${S.diffDays(today(), it.start)}일 뒤</span>`;
};
const itemRow = it => `<button class="item t-${it.type}" data-act="item" data-id="${it.id}" data-kid="${it.kid}"><span class="dot"></span><span><b>${tab === 'cal' && many() ? esc(kidOf(it.kid).name) + ', ' : ''}${esc(it.title)}</b><span class="when">${it.done ? kd(it.done) + ' 완료' : it.start === it.end ? kd(it.start) : `${kd(it.start)} ~ ${kd(it.end)}`}</span></span>${chipOf(it)}</button>`;

// 날짜가 말이 되는지 보고, 안 되면 이유를 돌려준다.
function dateProblem(d, born) {

  const n = S.diffDays(today(), d);
  if (born) return n > 0 ? '생일이 오늘보다 뒤예요.' : n < -4745 ? '만 13세 미만 아이의 생일을 넣어 주세요.' : '';

}

// 여러 아이를 한 번에 읽는다. 문제가 있으면 어느 아이인지 알려준다.
function readKids(f) {

}

const renameBtn = '<button class="btn" data-act="rename">이름 바꾸기</button>';

  const p = S.diffDays(start, t) / Math.max(1, S.diffDays(start, S.addMonths(start, 12))) * 100, base = Math.floor(S.ageMonths(K().birth, t) / 12) * 12;

    ${a >= 0 ? ruler(p, Array.from({ length: 49 }, (_, i) => ({ x: i / 48 * 100, l: i % 12 === 0 })), [0, 3, 6, 9, 12].map(k => base + k + '개월')) : ''}</section>`;

async function findPlace() {
  if (!navigator.geolocation) throw new Error('이 기기에서는 위치를 쓸 수 없어요.');
  const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, e => no(new Error(e.code === 1 ? '위치가 허용되지 않았어요. 휴대폰 설정에서 이 브라우저의 위치를 켜거나 지역을 직접 골라 주세요.' : '위치를 찾지 못했어요. 지역을 직접 골라 주세요.')), { timeout: 15000, maximumAge: 600000 }));
  const r2 = n => n.toFixed(2); // 약 1km로 뭉뚱그려 보낸다
  let a;
  try { const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${r2(pos.coords.latitude)}&lon=${r2(pos.coords.longitude)}&zoom=12&accept-language=ko`, { signal: AbortSignal.timeout(15000) }); if (!r.ok) throw 0; a = (await r.json()).address; }
  catch { throw new Error('지역 이름을 받지 못했어요. 지역을 직접 골라 주세요.'); }
  const at = Regions.fromAddress(a);
  if (!at) throw new Error('국내 지역을 찾지 못했어요. 지역을 직접 골라 주세요.');
  return at;
}

// JPEG에 적힌 촬영일을 읽는다.
async function exifDate(file) {
  try {
    const v = new DataView(await file.slice(0, 131072).arrayBuffer());
    if (v.getUint16(0) !== 0xffd8) return null;
    let o = 2;
    while (o < v.byteLength - 10) {
      if (v.getUint16(o) === 0xffe1 && v.getUint32(o + 4) === 0x45786966) {
        const t = o + 10, le = v.getUint16(t) === 0x4949, u16 = a => v.getUint16(a, le), u32 = a => v.getUint32(a, le);
        const find = (ifd, tag) => { for (let i = 0, n = u16(ifd); i < n; i++) if (u16(ifd + 2 + i * 12) === tag) return u32(ifd + 2 + i * 12 + 8); return 0; };
        const ex = find(t + u32(t + 4), 0x8769); if (!ex) return null;
        const s = find(t + ex, 0x9003); if (!s) return null;
        let str = ''; for (let i = 0; i < 10; i++) str += String.fromCharCode(v.getUint8(t + s + i));
        const d = str.replace(/:/g, '-'); return isDate(d) && d > '1990' ? d : null;
      }
      o += 2 + v.getUint16(o + 2);
    }
  } catch { } return null;
}
async function upload(files, fixedDate) {
  const added = [], bad = [];
  for (const f of files) {
    try {
      const bmp = await createImageBitmap(f);
      const r = await api('/api/photos', { method: 'POST', body: f });
      const k = Math.min(1, 480 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
      const b = await new Promise(x => c.toBlob(x, 'image/jpeg', .82));
      if (b) await api(`/photos/${r.id}/thumb`, { method: 'PUT', body: b }).catch(() => { });
      added.push({ id: r.id, date: fixedDate || await exifDate(f) || new Date(f.lastModified).toLocaleDateString('sv-SE'), caption: '', kid: K().id });
    } catch (e) { bad.push(f.name + (e.status ? ': ' + e.message : ': 열 수 없는 사진이에요')); }
  }
  if (added.length && await save(d => d.photos.push(...added))) autoUpload();
  if (bad.length) toast(bad[0] + (bad.length > 1 ? ` 외 ${bad.length - 1}장` : '')); else if (added.length) toast(`사진 ${added.length}장을 넣었어요`);
  return added;
}

const facesOf = k => db.faces.filter(f => f.kid === k.id).sort((a, b) => a.date < b.date ? -1 : 1);
const dayNo = (k, d) => S.diffDays(k.birth, d) + 1;

}
function growth() {
  const k = K(), t = today();
  if (!k.born) return mission();
  const fs = facesOf(k), has = new Set(fs.map(f => f.date)), n = dayNo(k, t);
  // 최근 두 주 안에 빠진 날은 빈칸으로 보여 나중에 채울 수 있게 한다.
  const miss = Array.from({ length: Math.min(14, n) }, (_, i) => S.addDays(t, -i)).filter(d => d >= k.birth && !has.has(d));
  const cells = fs.map(f => ({ d: f.date, f })).concat(miss.map(d => ({ d }))).sort((a, b) => a.d < b.d ? 1 : -1);
  return mission() + driveBar() + `<section class="stack"><div class="row between"><h2>성장 앨범 ${fs.length}장</h2><button class="btn main" data-act="video" ${fs.length < 2 ? 'disabled' : ''}>성장 영상 만들기</button></div><p class="sub">${fs.length < 2 ? '얼굴 사진이 두 장부터 영상을 만들 수 있어요. ' : ''}여기 사진은 사진첩과 따로 저장돼요. 빈칸을 누르면 지난 날짜 사진도 넣을 수 있어요.</p>
    <div class="grid">${cells.map(c => c.f ? `<button data-act="face" data-id="${c.f.id}" aria-label="${dayNo(k, c.d)}일차 사진"><img ${pic(c.f.id, 1)} alt="${dayNo(k, c.d)}일차 얼굴 사진"><span class="d">${dayNo(k, c.d)}일차</span></button>` : `<button class="miss" data-act="faceadd" data-d="${c.d}" aria-label="${dayNo(k, c.d)}일차 사진 넣기">${dayNo(k, c.d)}일차<br>넣기</button>`).join('')}</div><div class="row"><button class="btn" data-act="faceadd">다른 날짜 사진 넣기</button></div></section>`;
}

let crop = null;
async function cropDlg(file, date, freeDate) {
  const k = K();
  let bmp; try { bmp = await createImageBitmap(file); } catch { return toast('열 수 없는 사진이에요'); }
  openDlg(`<form data-form="crop"><h2>얼굴을 원 안에 맞춰 주세요</h2><div class="crop"><canvas id="cropc" width="1080" height="1080" aria-label="사진을 끌어서 옮기기"></canvas><i></i></div><label class="f">크기<input type="range" id="cropz" min="1" max="5" step="0.01" value="1"></label><label class="f">날짜<input type="date" name="date" required min="${k.birth}" max="${today()}" value="${date}" ${freeDate ? '' : 'readonly'}></label><p class="sub" id="cropd"></p>${acts()}</form>`);
  crop = { bmp, z: 1, x: bmp.width / 2, y: bmp.height / 2, kid: k.id };
  const c = $('#cropc'), g = c.getContext('2d'), base = Math.min(bmp.width, bmp.height);
  const draw = () => {
    const w = base / crop.z; crop.x = Math.max(w / 2, Math.min(bmp.width - w / 2, crop.x)); crop.y = Math.max(w / 2, Math.min(bmp.height - w / 2, crop.y));
    g.drawImage(bmp, crop.x - w / 2, crop.y - w / 2, w, w, 0, 0, 1080, 1080);
  };
  const label = () => { const d = dlg.querySelector('[name=date]').value; $('#cropd').textContent = isDate(d) && d >= k.birth ? `${k.name} ${dayNo(k, d)}일차` + (db.faces.some(f => f.kid === k.id && f.date === d) ? ', 저장하면 이날 사진이 바뀌어요' : '') : '태어난 날부터 고를 수 있어요'; };
  dlg.querySelector('[name=date]').addEventListener('input', label); label();
  $('#cropz').addEventListener('input', e => { crop.z = Number(e.target.value); draw(); });
  let p = null;
  c.addEventListener('pointerdown', e => { p = [e.clientX, e.clientY]; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => { if (!p) return; const s = base / crop.z / c.clientWidth; crop.x -= (e.clientX - p[0]) * s; crop.y -= (e.clientY - p[1]) * s; p = [e.clientX, e.clientY]; draw(); });
  ['pointerup', 'pointercancel'].forEach(n => c.addEventListener(n, () => { p = null; }));
  draw();
}
async function saveFace(date) {
  const k = kidOf(crop.kid);

  const old = db.faces.filter(f => f.kid === k.id && f.date === date);

}

async function makeVideo(sec) {
  const k = K(), fs = facesOf(k), type = videoType();
  openDlg(`<form data-form="none"><h2>영상을 만드는 중이에요</h2><canvas id="vc" width="720" height="720" style="width:100%;max-width:340px;margin:auto;border-radius:10px"></canvas><progress id="vp" max="1" value="0"></progress><div class="row"><button type="button" class="btn" data-act="close">그만두기</button></div></form>`);
  const c = $('#vc'), g = c.getContext('2d'), job = video = { stop: false }, chunks = [];
  const still = () => !job.stop && document.body.contains(c) && dlg.open;
  const load = async f => { const b = await photoBlob(f.id); return b ? createImageBitmap(b).catch(() => null) : null; };
  const draw = (img, next, a, text) => {
    g.globalAlpha = 1; g.fillStyle = '#33291a'; g.fillRect(0, 0, 720, 720); if (img) g.drawImage(img, 0, 0, 720, 720);
    if (next && a > 0) { g.globalAlpha = a; g.drawImage(next, 0, 0, 720, 720); g.globalAlpha = 1; }
    if (text) { g.font = '700 34px "Apple SD Gothic Neo","Noto Sans KR",sans-serif'; g.textAlign = 'center'; g.fillStyle = 'rgba(51,41,26,.62)'; g.fillRect(0, 648, 720, 72); g.fillStyle = '#fffefa'; g.fillText(text, 360, 696); }
  };
  const title = () => { g.fillStyle = '#fff8d9'; g.fillRect(0, 0, 720, 720); g.fillStyle = '#33291a'; g.textAlign = 'center'; g.font = '800 60px "Apple SD Gothic Neo","Noto Sans KR",sans-serif'; g.fillText(k.name, 360, 350, 640); g.font = '500 30px "Apple SD Gothic Neo","Noto Sans KR",sans-serif'; g.fillText(`${kd(fs[0].date, true)}부터 ${dayNo(k, fs[fs.length - 1].date)}일차까지`, 360, 410, 640); };
  let rec;
  try {
    title();
    const stream = c.captureStream(30);
    rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 4000000 });

    const ended = new Promise(x => { rec.onstop = x; });

  else if (act === 'faceadd') pickFace(d.d || '', Boolean(d.cam));
  else if (act === 'face') faceDlg(id);
  else if (act === 'video') videoDlg();
  else if (act === 'sharephoto') { const p = allPhotos().find(x => x.id === id), bl = await photoBlob(id); if (bl) readyDlg(bl, `${p.date}.${extOf(bl)}`, '사진 내보내기'); else toast('사진을 찾지 못했어요'); }
  else if (act === 'outshare') navigator.share({ files: [out.file] }).catch(e => { if (e.name !== 'AbortError') toast('공유 창을 열지 못했어요. 내려받기를 눌러 주세요.'); });
  else if (act === 'outsave') saveFile(out.blob, out.name);
  else if (act === 'hospitals') hospDlg();
  else if (act === 'nearme') { b.disabled = true; b.textContent = '위치를 찾는 중'; const box = b.closest('section'); try { spot = await where(); } catch (e) { toast(e.message); } if (box.isConnected) fillNear(box, Number(d.n)); }
  else if (act === 'map') showMap(Number(d.i));
  else if (act === 'login') Drive.login(GOOGLE_ID);
  else if (act === 'loginlater') { try { localStorage.setItem('baby-login-later', Date.now()); } catch { } render(); }
  else if (act === 'logout') { await Drive.logout(); sent = new Set(); keepSent(); dlg.close(); render(); toast('로그아웃했어요. 사진은 이 기기에 그대로 있어요.'); }
  else if (act === 'upload') { if (dlg.open) dlg.close(); uploadAll(); }
  else if (act === 'upstop') job.stop = true;
  else if (act === 'drive') driveDlg();
  else if (act === 'pull') { b.disabled = true; pull(); }
  else if (act === 'drivedel') {
    if (d.sure !== '1') { d.sure = '1'; b.textContent = '한 번 더'; return true; }
    try { const f = driveFiles.find(x => x.id === id); await Drive.trash(id); if (f) { skip.add(f.appProperties.pid); try { localStorage.setItem('baby-drive-skip', JSON.stringify([...skip])); } catch { } } await driveDlg(); } catch (e) { toast(e.message); }
  } else return false;
  return true;
}

/* ── 동작 ── */
document.addEventListener('click', async ev => {
  const nt = ev.target.closest('[data-tab]');
  if (nt && ready) { tab = nt.dataset.tab; syncAI(); render(); scrollTo(0, 0); return; }
  const b = ev.target.closest('[data-act]'); if (!b || !ready) return;
  const { act, id } = b.dataset;
  if (act === 'close') (b.closest('dialog') || dlg).close();
  else if (await moreActs(act, b, id)) return;
  else if (act === 'settings') settingsDlg();
  else if (act === 'born') bornDlg();
  else if (act === 'locate') locate();
  else if (act === 'region') regionDlg();
  else if (act === 'reload') { regionData.err = ''; regionData.key = ''; render(); }
  else if (act === 'rename') openDlg(`<form data-form="rename"><h2>이름 바꾸기</h2><label class="f">태명이나 이름<input name="name" id="rName" required maxlength="20" autocomplete="off" value="${esc(K().name)}"></label>${acts()}</form>`);
  else if (act === 'due') openDlg(`<form data-form="due"><h2>출산 예정일 바꾸기</h2><div class="two"><label class="f">출산 예정일<input type="date" name="birth" required value="${K().birth}"></label><label class="f">예정 시각 (선택)<input type="time" name="time" value="${K().time || ''}"></label></div>${acts()}</form>`);
  else if (act === 'item') itemDlg(id, b.dataset.kid);
  else if (act === 'event') eventDlg(id);
  else if (act === 'write') writeDlg(id);
  else if (act === 'photo') photoDlg(id);
  else if (act === 'donetoday') dlg.querySelector('[name=done]').value = today();
  else if (act === 'day') { sel = b.dataset.d; render(); }
  else if (act === 'mon') { month = S.addMonths(month + '-01', Number(b.dataset.n)).slice(0, 7); sel = month === today().slice(0, 7) ? today() : month + '-01'; render(); }
  else if (act === 'rec') { rec = b.dataset.k; render(); }
  else if (act === 'ai') runAI(b.dataset.k, Boolean(aiData[b.dataset.k]));
  else if (act === 'ics') await download();
  else if (act === 'backup') { try { readyDlg(await Local.backup(), `아기수첩-백업-${today()}.zip`, '백업 파일을 만들었어요'); } catch (e) { toast(e.message); } }
  else if (act === 'restore') {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '지금 내용을 지우고 되돌리기'; return; }
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.zip,application/zip';
    i.onchange = async () => { try { await Local.restore(i.files[0]); await load(); dlg.close(); toast('백업을 되돌렸어요'); } catch (e) { toast(e.message || '되돌리지 못했어요'); } };
    i.click();
  }
  else if (act === 'addphotos') { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = true; i.onchange = () => upload([...i.files]); i.click(); }
  else if (act === 'undraft') { draft = draft.filter(x => x !== id); $('#dgrid').innerHTML = draftGrid(); }
  else if (act === 'adddue') { const k = b.dataset; if (await save(d => d.events.push({ id: uid(), title: k.title, date: k.date, time: '', memo: '혜택 신청 마감일', from: k.key, kid: K().id }))) toast('달력에 추가했어요'); }
  else if (act === 'del') {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '한 번 더 누르면 지워요'; return; }
    const k = b.dataset.k;
    if (k === 'event' && await save(d => { d.events = d.events.filter(x => x.id !== id); })) dlg.close();
    if (k === 'diary' && await save(d => { d.diary = d.diary.filter(x => x.id !== id); })) { dlg.close(); toast('일기를 지웠어요. 사진은 사진첩에 남아 있어요.'); }
    if (k === 'kid' && await save(d => { Family.removeKid(d, id); Family.rank(d.kids); })) { dlg.close(); toast('아이를 뺐어요. 일기와 사진은 남아 있어요.'); }
    if (k === 'face' && await save(d => { d.faces = d.faces.filter(x => x.id !== id); })) { await api('/api/photos/' + id, { method: 'DELETE' }).catch(() => { }); dlg.close(); toast('얼굴 사진을 지웠어요'); }
    if (k === 'photo' && await save(d => { d.photos = d.photos.filter(x => x.id !== id); d.diary.forEach(x => x.photos = x.photos.filter(y => y !== id)); })) { await api('/api/photos/' + id, { method: 'DELETE' }).catch(() => { }); dlg.close(); toast('사진을 지웠어요'); }
  }
});
document.addEventListener('change', async ev => {
  if (ev.target.id !== 'dfile') return;
  const form = ev.target.form, files = [...ev.target.files], ok = form.querySelector('[value=ok]');
  ok.disabled = true;
  const added = await upload(files, form.elements.date.value || today());
  ok.disabled = false; ev.target.value = '';
  draft.push(...added.map(p => p.id)); if ($('#dgrid')) $('#dgrid').innerHTML = draftGrid();
});
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target, v = Object.fromEntries(new FormData(f)), id = f.dataset.id, kind = f.dataset.form;
  let ok = false;
  if (kind === 'item') ok = await save(d => { const r = (d.kids.find(k => k.id === f.dataset.kid) || d.kids[0]).records; if (v.appt || v.done) r[id] = { appt: v.appt || null, done: v.done || null }; else delete r[id]; });
  if (kind === 'event') ok = await save(d => { const e = d.events.find(x => x.id === id), n = { title: v.title.trim(), date: v.date, time: v.time, memo: v.memo, kid: v.kid != null ? v.kid : e ? e.kid : K().id }; if (e) Object.assign(e, n); else d.events.push(Object.assign({ id: uid() }, n)); });
  if (kind === 'diary') {
    if (!v.body.trim() && !draft.length) return toast('내용을 쓰거나 사진을 넣어 주세요');
    ok = await save(d => { const e = d.diary.find(x => x.id === id), n = { date: v.date, body: v.body.trim(), photos: [...draft], kid: v.kid != null ? v.kid : e ? e.kid : K().id }; if (e) Object.assign(e, n); else d.diary.push(Object.assign({ id: uid() }, n)); d.photos.forEach(p => { if (draft.includes(p.id)) { p.date = v.date; if (v.kid != null) p.kid = v.kid; } }); });
  }
  if (kind === 'photo') ok = await save(d => Object.assign(d.photos.find(x => x.id === id), { date: v.date, caption: v.caption.trim() }, v.kid != null ? { kid: v.kid } : {}));
  if (kind === 'due') {
    const bad = dateProblem(v.birth, false); if (bad) return toast(bad);
    ok = await save(d => Object.assign(d.kids.find(k => k.id === K().id), { birth: v.birth, time: v.time }));
  }
  if (kind === 'start' || kind === 'addkid') {
    const { bad, list } = readKids(f); if (bad) return toast(bad);
    const google = ev.submitter && ev.submitter.value === 'google';
    if (kind === 'start') {
      started = true;
      ok = await save(d => { d.kids = list.map((x, i) => Family.newKid('k' + (i + 1), Object.assign({}, x, { name: blankName(list, x, i), options: Object.assign({}, S.DEFAULT_OPTIONS) }))); d.cur = 'k1'; Family.rank(d.kids); });
      if (!ok) { started = false; render(); return; }
      if (google) return Drive.login(GOOGLE_ID);
      setTimeout(askLocationOnce, 300);
    } else {
      const nid = uid();
      ok = await save(d => { d.kids.push(Family.newKid(nid, Object.assign({}, list[0], { name: list[0].name || '아기 ' + (d.kids.length + 1), options: Object.assign({}, S.DEFAULT_OPTIONS) }))); d.cur = nid; Family.rank(d.kids); });
    }
  }
  if (kind === 'none') return;
  if (kind === 'crop') { const ok = f.querySelector('[value=ok]'); ok.disabled = true; await saveFace(v.date); ok.disabled = false; return; }
  if (kind === 'video') return makeVideo(Number(v.sec));
  if (kind === 'region') { ok = await save(d => { d.sido = v.sido; d.sigungu = v.sigungu || ''; }); if (ok) { tab = 'money'; scrollTo(0, 0); } }
  if (kind === 'rename') { if (!v.name.trim()) return toast('이름을 적어 주세요'); ok = await save(d => { d.kids.find(k => k.id === K().id).name = v.name.trim(); }); }
  if (kind === 'born') {
    const tw = new FormData(f).getAll('twin');
    ok = await save(d => { Object.assign(d.kids.find(k => k.id === K().id), { birth: v.birth, time: v.time, born: true, name: v.name.trim() || K().name }); tw.forEach(x => { const k = d.kids.find(y => y.id === x); Object.assign(k, { birth: v.birth, time: v['tt_' + x], born: true, name: v['tn_' + x].trim() || k.name }); }); Family.rank(d.kids); });
  }
  if (kind === 'kid') {
    const bad = dateProblem(v.birth, Boolean(v.born)); if (bad) return toast(bad);
    ok = await save(d => { const k = d.kids.find(x => x.id === id); Object.assign(k, { name: v.name.trim() || k.name, birth: v.birth, time: v.time, born: Boolean(v.born), order: Number(v.order), options: { combo: v.combo, rota: v.rota, je: v.je } }); });
  }
  if (kind === 'face') { ok = await save(d => { const x = d.faces.find(y => y.id === id); if (d.faces.some(y => y.id !== id && y.kid === x.kid && y.date === v.date)) { v.dup = 1; return; } x.date = v.date; }); if (v.dup) return toast('그 날짜에는 이미 얼굴 사진이 있어요'); }
  if (kind === 'settings') {
    if (local && v.aiCode != null) saveAI(v.aiCode.trim());
    ok = await save(d => Object.assign(d, { leads: new FormData(f).getAll('lead').map(Number), hour: Number(v.hour) }));
  }
  if (ok) { dlg.close(); toast('저장했어요'); syncAI(); render(); }
});
async function download() {
  if (!await save(d => { d.exports++; })) return;
  const one = many() ? '' : K().name, list = db.kids.flatMap(k => items(k).map(i => Object.assign(i, { who: k.name, uid: (k.id === 'k1' ? '' : k.id + '-') + i.id })));
  const { text, count } = S.toICS(list, { name: one || '우리 아이들', today: today(), leads: db.leads, hour: db.hour, sequence: db.exports, events: db.events.filter(e => e.date >= today()).map(e => many() && e.kid ? Object.assign({}, e, { title: kidOf(e.kid).name + ' ' + e.title }) : e), stamp: new Date().toISOString().replace(/[-:]|\.\d+/g, '') });
  saveFile(new Blob([text], { type: 'text/calendar' }), (one || '우리아이들').replace(/[\\/:*?"<>|]/g, '') + '-일정.ics');
  toast(`일정 ${count}개를 담았어요`);
}
function saveFile(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); }
async function load() { const s = await api('/api/state'); rev = s.rev; db = Object.assign(fresh(), Family.migrate(s.data) || {}); ready = true; started = Boolean(s.data); const r = Regions.find(db.sido); if (db.sido && r) db.sido = r.name; render(); }
(async () => {
  try {
    // 내 컴퓨터에서 npm start로 켰을 때만 서버가 있다.
    local = !(['localhost', '127.0.0.1'].includes(location.hostname) && await fetch('/api/status').then(r => r.ok && (r.headers.get('content-type') || '').includes('json')).catch(() => false));
    ai = local ? Boolean(aiBase() && conf.code) : (await api('/api/status')).ai;
    const back = local && GOOGLE_ID ? Drive.finish() : null;
    await load();
    if (back) afterLogin(back); else askLocationOnce();
    if (local && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    if (local && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) { $('#main').innerHTML = `<div class="notice hot"><b>수첩을 열지 못했어요</b><p>${esc(e.message)}</p></div>`; }
})();
</script>
