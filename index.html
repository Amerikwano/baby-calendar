<script>/* 육아 전용 앱: ?only=baby 로 열면 아기 수첩만 보인다 */window.ONLY=/[?&]only=baby/.test(location.search)||sessionStorage.getItem('baby-only')?'baby':'';if(ONLY){sessionStorage.setItem('baby-only','1');document.querySelector('link[rel=manifest]').href='manifest-baby.webmanifest';document.title='우리 아기 수첩';document.querySelector('link[rel=apple-touch-icon]').href='apple-touch-icon-baby.png';document.querySelector('link[rel=icon]').href='icon-baby-192.png';document.querySelector('meta[name=apple-mobile-web-app-title]').content='우리 아기 수첩';}</script>

<style>
/* 첫 화면은 다른 파일을 기다리지 않고 바로 보인다 */
html,body{background:#faf5ee}
#splash{position:fixed;inset:0;z-index:50;background:#faf5ee;display:grid;place-content:center;justify-items:center;gap:10px;color:#4f3f3a;font-family:NanumSquareRound,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;transition:opacity .35s}
#splash.off{opacity:0;pointer-events:none}
#splash .ring{width:148px;height:148px;border-radius:50%;background:#fff;border:7px solid #ffd976;display:grid;place-items:center;overflow:hidden;animation:bob 1.6s ease-in-out infinite}
#splash .ring svg{width:112px}#splash .ring img{width:100%;height:100%;object-fit:cover}
#splash b{font-size:27px;font-weight:700;margin-top:12px}#splash span{font-size:15px;color:#7a685d}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){#splash .ring{animation:none}#splash{transition:none}}
</style>
<link rel="stylesheet" href="app.css">
</head>
